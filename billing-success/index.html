<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookli — Payment successful</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #FFF8E7; color: #1a1a1a; padding: 24px; box-sizing: border-box;
  }
  .card {
    max-width: 420px; background: #fff; border-radius: 20px; padding: 32px 28px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08); text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.5; color: #555; margin: 0 0 8px; }
  .hint { font-size: 13px; color: #999; margin-top: 20px; }
  .btn {
    display: block; margin: 20px 0 4px; padding: 14px 20px; border-radius: 50px;
    background: linear-gradient(90deg, #D97706, #F97316); color: #fff; font-weight: 700;
    font-size: 15px; text-decoration: none; box-shadow: 0 6px 16px rgba(217,119,6,0.3);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>✅ Payment successful!</h1>
    <p>Your Bookli subscription is now active.</p>
    <a class="btn" href="bookli://billing-success">Open Bookli</a>
    <p class="hint">If nothing happens, make sure Bookli is installed, then just switch back to
    it manually — your subscription status updates automatically either way.</p>
  </div>
</body>
</html>
